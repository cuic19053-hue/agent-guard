server:
  host: "0.0.0.0"
  port: 8080
  target_url: "https://api.openai.com"

circuit_breaker:
  enabled: true
  max_repeated_tool_calls: 3
  max_session_turns: 30
  hard_budget_tokens: 150000

security:
  block_dangerous_tools: true
  blocked_patterns:
    - "rm\\s+(-[a-zA-Z]*r[a-zA-Z]*f|-[a-zA-Z]*f[a-zA-Z]*r)"
    - "drop\\s+database"
    - "drop\\s+table"
    - "truncate\\s+table"
    - "mkfs"
    - "chmod\\s+777"
